kind = "api"
previewPath = "/"
title = "AI Trading Debate"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8000
name = "AI Trading Debate"
paths = ["/"]

[services.development]
run = "cd ../trading-debate && python -m streamlit run main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"

[services.production]

[services.production.run]
args = ["python", "-m", "streamlit", "run", "artifacts/trading-debate/main.py", "--server.address", "0.0.0.0", "--server.headless", "true", "--server.enableCORS", "false", "--server.enableWebsocketCompression", "false", "--server.port", "8000"]

[services.production.health.startup]
path = "/_stcore/health"
