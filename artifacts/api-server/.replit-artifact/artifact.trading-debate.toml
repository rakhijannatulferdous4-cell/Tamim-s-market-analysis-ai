kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 8000
name = "AI Trading Debate"
paths = ["/"]

[services.development]
run = "cd artifacts/trading-debate && python -m streamlit run main.py --server.port 8000 --server.address 0.0.0.0 --server.headless true"

[services.production]
serve = "process"

[services.production.run]
args = ["python", "-m", "streamlit", "run", "artifacts/trading-debate/main.py", "--server.address", "0.0.0.0", "--server.headless", "true", "--server.enableCORS", "false", "--server.enableWebsocketCompression", "false", "--server.port", "8000"]

[services.production.health.startup]
path = "/_stcore/health"
