kind = "streamlit"
previewPath = "/"
title = "AI Trading Debate"
version = "1.0.0"
id = "trading-debate-001"

[[services]]
localPort = 8000
name = "AI Trading Debate"
paths = ["/"]

[services.development]
run = "cd artifacts/trading-debate && python -m streamlit run main.py --server.port 8000 --server.address 0.0.0.0 --server.headless true"


[services.production]

[services.production.run]
args = ["python", "-m", "streamlit", "run", "artifacts/trading-debate/main.py", "--server.address", "0.0.0.0", "--server.headless", "true", "--server.enableCORS", "false", "--server.port", "8000"]

[services.production.run.env]
PORT = "8000"
